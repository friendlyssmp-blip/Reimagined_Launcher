appId: com.reimagined.launcher
productName: Reimagined
copyright: Copyright © 2026 Reimagined

directories:
  buildResources: build
  output: dist

files:
  - out/**
  - package.json

asar: true

win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-Setup-${version}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Reimagined

publish: null
